name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Capacitor project
        run: |
          mkdir -p www/assets

          cp index.html style.css app.js www/
          cp -r assets/. www/assets/

          cat > package.json <<'EOF'
          {
            "name": "incremental-game",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Build complete"
            },
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          npm install

      - name: Configure Capacitor
        run: |
          npx cap init "Incremental Game" com.example.incrementalgame --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Incremental-Game-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
