name: Pure Source Code Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --- COMPILE WINDOWS EXE ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v7

      - name: Setup Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Package HTML into Windows EXE
        run: |
          npm install -g nativefier
          nativefier --name "IncrementalApp" --app-version "1.0.1" --platform "windows" --arch "x64" --single-instance ./

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: "*win32-x64/"
          
  # --- COMPILE ANDROID APK ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v7

      - name: Setup Java Development Kit
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Android Environment from scratch
        run: |
          # 1. Structure the temporary web folder using script.js
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/
          
          # 2. Write minimalist local manifest parameters
          echo '{"name": "incremental-app", "version": "1.0.1"}' > package.json
          echo '{"appId": "com.incremental.app", "appName": "Incremental App", "webDir": "www"}' > capacitor.config.json
          
          # 3. Explicitly install dependencies so native plugins bridge seamlessly
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          # 4. Generate native framework directories and force resource copy
          npx cap add android
          npx cap copy android
          npx cap sync android
          
          # 5. Compile Android Binary
          cd android && ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
