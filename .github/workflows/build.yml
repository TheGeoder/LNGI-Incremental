name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare web assets
        run: |
          mkdir -p www/assets
          cp index.html style.css app.js www/
          cp -r assets/. www/assets/

      - name: Install Capacitor 8
        run: |
          printf '{"name":"incremental-game","version":"1.0.0","private":true}\n' > package.json

          npm install --no-save --no-package-lock --no-audit --no-fund \
            @capacitor/core@8.6.0 \
            @capacitor/cli@8.6.0 \
            @capacitor/android@8.6.0

      - name: Initialize Android
        run: |
          npx cap init "Incremental Game" com.incremental.game --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.0-alpha1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
